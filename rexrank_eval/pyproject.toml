[project]
name = "rrg-indo-rexrank-eval"
version = "0.1.0"
description = "ReXrank-style metrics (BLEU-2, BERTScore, SembScore, RadGraph, RadCliQ-v1, RaTEScore, GREEN, CRIMSON) for rrg_indo predictions; separate env so the training venv stays untouched"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "radeval==2.2.1",
    "crimson-score==0.2.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "sacrebleu>=2.4",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
